name: CI

on:
  push:
  pull_request:
  workflow_dispatch:  # "Run workflow" button in the Actions tab builds an .exe without a release

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -v

  build-exe:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write  # needed to create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pyinstaller --onefile --windowed --name ValoSettings --collect-data customtkinter --paths src scripts/launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ValoSettings
          path: dist/ValoSettings.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ValoSettings.exe
          draft: true  # review and edit the notes on GitHub, then click Publish
