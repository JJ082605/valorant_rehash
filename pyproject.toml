[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valo-settings"
version = "0.1.0"
description = "Copy VALORANT settings between Riot accounts on the same PC, without ever touching your password."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests", "customtkinter", "psutil"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
valo-settings = "valo_settings.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
